name: orders-demo

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: dev/backend.Dockerfile
    working_dir: /app
    init: true
    environment:
      DATABASE_URL: postgres://orders:orders@db:5432/orders_development
      BUNDLE_PATH: /usr/local/bundle
      RAILS_ENV: development
    volumes:
      - ./backend:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "-c", "set -e; bundle check || bundle install; bundle exec rails db:prepare; rm -f tmp/pids/server.pid; exec bundle exec rails server -b 0.0.0.0"]

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    init: true
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]

volumes:
  postgres_data:
  bundle_data:
  node_modules:
